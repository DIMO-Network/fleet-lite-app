ENVIRONMENT: dev
LOG_LEVEL: info
USE_DEV_CERTS: true

API_PORT: 8084          # web server port
MONITORING_PORT: 8085

SERVICE_NAME: fleet-lite-app

DB:
  PORT: 5432
  NAME: fleet_lite_app
  MAX_OPEN_CONNECTIONS: 10
  MAX_IDLE_CONNECTIONS: 3
  HOST: localhost
  USER: dimo
  PASSWORD: dimo

## Authentication
JWT_KEY_SET_URL: https://auth.dimo.zone/keys
TOKEN_EXCHANGE_URL: https://token-exchange-api.dimo.zone

## Login With DIMO
DIMO_LOGIN_URL: https://login.dimo.org
DIMO_AUTH_URL: https://auth.dimo.zone
DIMO_AUTH_REDIRECT_URL: https://local-fleet-lite.dimo.org:3009/login.html
DIMO_AUTH_CLIENT_ID: '0x51dacC165f1306Abfbf0a6312ec96E13AAA826DB'  # shared with rental-fleets-app
DIMO_AUTH_PRIVATE_KEY: ''

## CORS — frontend dev origin + production console
ALLOWED_ORIGINS: 'https://local-fleet-lite.dimo.org:3009,https://console.dimo.org'

## Multi-tenancy — AES-256-GCM key for encrypting tenant DIMO API keys at rest.
## Any non-empty string works locally; use a strong random value in prod.
TENANT_SECRET_ENC_KEY: 'local-dev-tenant-enc-key-change-me'

## DIMO API dependencies
IDENTITY_API_ENDPOINT: https://identity-api.dimo.zone/query

## Document services (glovebox)
EXTRACT_API_URL: https://extract.dimo.zone/extract
FETCH_API_URL:   https://fetch-api.dimo.zone/v1/fetch/objects
ATTEST_API_URL:  https://attest.dimo.zone

## Telemetry (vehicle-details charts)
TELEMETRY_API_URL: https://telemetry-api.dimo.zone/query

## Chain config (polygon mainnet)
CHAIN_ID: 137
VEHICLE_NFT_ADDRESS: '0xbA5738a18d83D41847dfFbDC6101d37C69c9B0cF'

## Member invitations (Postmark transactional email)
POSTMARK_SERVER_TOKEN: ''                              # secret — Postmark server API token
INVITATION_FROM_EMAIL: 'no-reply@dimo.co'              # must be a verified Postmark sender
POSTMARK_INVITATION_TEMPLATE_ALIAS: 'fleet-invitation' # api/templates/postmark, pushed via make push-postmark-templates
APP_BASE_URL: 'https://local-fleet-lite.dimo.org:3009' # public origin for the accept link
INVITE_EXPIRY_HOURS: 168                               # 7 days
