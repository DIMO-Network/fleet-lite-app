name: web-lint
on:
  pull_request:
    branches: [ '**' ]
jobs:
  web-lint:
    name: lint
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: install deps
        run: npm ci
        working-directory: web
      - name: lint
        run: npm run lint:check
        working-directory: web
      - name: localize drift check
        run: |
          npm run localize
          if ! git diff --exit-code -- xliff src/generated; then
            echo "::error::Localization is out of sync. Run 'npm run localize' in web/ and commit the changes to xliff/ and src/generated/."
            exit 1
          fi
        working-directory: web
