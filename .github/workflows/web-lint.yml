name: web-lint
on:
  pull_request:
    branches: [ '**' ]
jobs:
  web-lint:
    name: lint
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: install deps
        run: npm ci
        working-directory: web
      - name: lint
        run: npm run lint:check
        working-directory: web
