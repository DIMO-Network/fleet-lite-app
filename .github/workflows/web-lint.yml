name: web-lint
on:
  pull_request:
    branches: [ '**' ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-lint:
    # The check name branch protection requires (docs/RELEASING.md).
    name: web
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Same major as the image build (Dockerfile, NodeSource 22.x).
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: install deps
        run: npm ci
        working-directory: web
      - name: lint
        run: npm run lint:check
        working-directory: web
      # Typecheck and production build: before this, a type error or a broken
      # build surfaced only in the post-merge Docker build.
      - name: typecheck and build
        run: npm run build
        working-directory: web
      - name: unit tests
        run: npm test
        working-directory: web
      - name: localize drift check
        run: |
          npm run localize
          if ! git diff --exit-code -- xliff src/generated; then
            echo "::error::Localization is out of sync. Run 'npm run localize' in web/ and commit the changes to xliff/ and src/generated/."
            exit 1
          fi
        working-directory: web
