name: golangci-lint
on:
  pull_request:
    branches: [ '**' ]

# PR code runs here (go test executes it), so the token it can reach is
# read-only and is not exported to every step's environment.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPRIVATE: github.com/DIMO-Network

# Job names are the check names branch protection requires (docs/RELEASING.md),
# so they are unique across workflows.
jobs:
  golangci:
    name: go-lint
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: false
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pinned: `latest` let a new linter release fail an unrelated PR.
          version: v2.14.0
          only-new-issues: false
          working-directory: api
          install-mode: "binary"
          args: --modules-download-mode=readonly --timeout=10m
  test:
    name: go-test
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: false
      - name: go test
        run: go test -timeout 3m ./...
        working-directory: api
