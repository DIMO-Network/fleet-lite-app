name: golangci-lint
on:
  pull_request:
    branches: [ '**' ]

# PR code runs here (go test executes it), so the token it can reach is
# read-only and is not exported to every step's environment.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPRIVATE: github.com/DIMO-Network

# Job names are the check names branch protection requires (docs/RELEASING.md),
# so they are unique across workflows.
jobs:
  golangci:
    name: go-lint
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'
          cache: false
      - name: golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          # Pinned: `latest` let a new linter release fail an unrelated PR.
          version: v2.14.0
          only-new-issues: false
          working-directory: api
          install-mode: "binary"
          args: --modules-download-mode=readonly --timeout=10m
  test:
    name: go-test
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'
          cache: false
      - name: go test
        run: go test -timeout 3m ./...
        working-directory: api
