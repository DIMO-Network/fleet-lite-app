name: buildpushdev
on:
  push:
    branches:
      - main

# The image-tag bump below commits to main; nothing else needs write access.
permissions:
  contents: write

# One dev build at a time: overlapping runs were last-writer-wins on
# values.yaml and could leave an older image deployed. A newer pending run
# replaces an older pending one, so dev converges on the newest commit.
concurrency:
  group: buildpushdev
  cancel-in-progress: false

jobs:
  build_dev:
    name: buildpushdev
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get short SHA
        id: slug
        run: echo "BUILD_TAG=$(echo ${GITHUB_SHA} | cut -c1-7)" >> $GITHUB_OUTPUT

      # This is the only image build. A release (buildpushprod) deploys the
      # image built here for the tagged commit instead of building its own.
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            COMMIT_HASH=${{ steps.slug.outputs.BUILD_TAG }}
          tags: dimozone/fleet-lite-app:${{ steps.slug.outputs.BUILD_TAG }}, dimozone/fleet-lite-app:latest

      - name: Update Image Version in the related HelmChart values.yaml
        uses: fjogeleit/yaml-update-action@451fb54614e46f952fc18ffd99e8c93b7b13f85e # v0.15.0
        with:
          valueFile: 'charts/fleet-lite-app/values.yaml'
          propertyPath: 'image.tag'
          value: ${{ steps.slug.outputs.BUILD_TAG }}
          branch: main
          message: 'Update dev image version to ${{ steps.slug.outputs.BUILD_TAG }}'
