<!doctype html>
<!-- TEMPORARY design-review page for docs/DRIVER_BEHAVIOUR_PLAN.md — delete before the backend lands. -->
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Design preview — driving behaviour</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet" />
    <script type="module" src="./src/design-preview.ts"></script>
    <style>
        html, body { height: 100%; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--background, #131313);
            color: var(--on-background, #e5e2e1);
            margin: 0;
        }
        .page { max-width: 1440px; margin: 0 auto; padding: 32px 40px 80px; }
        .bar {
            display: flex; align-items: center; justify-content: space-between; gap: 16px;
            margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--outline-variant);
        }
        .bar h1 { font: 600 24px/32px 'Inter', sans-serif; margin: 0; color: var(--primary); }
        .bar p { margin: 4px 0 0; font: 400 14px/20px 'Inter', sans-serif; color: var(--on-surface-variant); }
        .bar button {
            font: 600 12px/16px 'JetBrains Mono', monospace; letter-spacing: 0.05em; text-transform: uppercase;
            padding: 10px 14px; border-radius: 8px; border: 1px solid var(--outline-variant);
            background: var(--surface-container-high); color: var(--on-surface); cursor: pointer;
        }
        .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 24px; }
        .col-12 { grid-column: span 12; }
        .section-label { grid-column: span 12; margin-top: 16px; font: 500 18px/28px 'Inter', sans-serif; color: var(--primary); }
    </style>
</head>
<body>
    <div class="page">
        <div class="bar">
            <div>
                <h1>Driving behaviour — design preview</h1>
                <p>Mock data. Vehicle details grid: trips panel (with per-trip event badges) followed by the new behaviour panel.</p>
            </div>
            <button id="theme">Toggle theme</button>
        </div>
        <div class="grid">
            <div class="col-12">
                <vehicle-trips-panel tokenId="186612"></vehicle-trips-panel>
            </div>
            <div class="col-12">
                <vehicle-behavior-panel tokenId="186612"></vehicle-behavior-panel>
            </div>
            <div class="section-label">Unsupported connection (AutoPi / Tesla / HashDog)</div>
            <div class="col-12">
                <vehicle-behavior-panel id="unsupported" tokenId="180895"></vehicle-behavior-panel>
            </div>
        </div>
    </div>
</body>
</html>
