<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/dimo-mark.png" />
    <meta name="theme-color" content="#0E0F11" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DIMO Fleet</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link rel="preload" href="/assets/fonts/EuclidCircularA-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/EuclidCircularA-Semibold.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Synchronous token check — must run BEFORE module scripts so a
      // logged-out visitor goes straight to login.html instead of letting
      // app-root mount, fire /vehicles, get rejected, and flash UI.
      (function () {
        // A DIMO grant returns here with the *grantor's* token and email in the
        // query. They are not ours — never store them; drop them from the
        // address bar and history.
        var q = new URLSearchParams(location.search);
        if (q.has('token') || q.has('email')) {
          q.delete('token');
          q.delete('email');
          var rest = q.toString();
          history.replaceState(null, '', location.pathname + (rest ? '?' + rest : '') + location.hash);
        }
        var t = localStorage.getItem('token');
        var expired = true;
        if (t) {
          try {
            var parts = t.split('.');
            if (parts.length === 3) {
              // base64url, which atob rejects as-is (see utils/token.ts).
              var b64 = parts[1].replace(/-/g, '+').replace(/_/g, '/');
              var payload = JSON.parse(atob(b64 + '==='.slice(0, (4 - b64.length % 4) % 4)));
              var exp = typeof payload.exp === 'number' ? payload.exp : 0;
              expired = exp < Math.floor(Date.now() / 1000);
            }
          } catch (e) { expired = true; }
        }
        if (expired) {
          window.location.replace('/login.html');
        }
      })();
    </script>
    <script type="module" src="./src/index.ts"></script>
    <style>
      html, body { height: 100%; }
      body {
        font-family: 'Euclid Circular A', system-ui, -apple-system, 'Segoe UI', sans-serif;
        background-color: #0E0F11;
        color: #EDEEEE;
        margin: 0;
        overflow: hidden;
      }
    </style>
</head>
<body>
  <app-root></app-root>
</body>
</html>
