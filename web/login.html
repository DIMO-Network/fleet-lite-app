<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/dimo-mark.png" />
    <meta name="theme-color" content="#0E0F11" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DIMO Fleet — Sign in</title>
    <link rel="preload" href="/assets/fonts/EuclidCircularA-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/EuclidCircularA-Semibold.woff2" as="font" type="font/woff2" crossorigin />
    <script type="module" src="./src/index.ts"></script>
    <style>
        /* Same faces as global-styles.ts (documentStyles); declared here too so the
           page paints in the brand face before the module graph loads. */
        @font-face { font-family: 'Euclid Circular A'; font-weight: 400; font-style: normal; font-display: swap; src: url('/assets/fonts/EuclidCircularA-Regular.woff2') format('woff2'); }
        @font-face { font-family: 'Euclid Circular A'; font-weight: 500; font-style: normal; font-display: swap; src: url('/assets/fonts/EuclidCircularA-Medium.woff2') format('woff2'); }
        @font-face { font-family: 'Euclid Circular A'; font-weight: 600; font-style: normal; font-display: swap; src: url('/assets/fonts/EuclidCircularA-Semibold.woff2') format('woff2'); }
        @font-face { font-family: 'Euclid Circular A'; font-weight: 700; font-style: normal; font-display: swap; src: url('/assets/fonts/EuclidCircularA-Bold.woff2') format('woff2'); }

        /* Mirrors the dark tokens in global-styles.ts. */
        :root {
            color-scheme: dark;
            --font-body: 'Euclid Circular A', system-ui, -apple-system, 'Segoe UI', sans-serif;

            --dimo-sky: #8CD0FF;
            --dimo-mint: #46F1E4;
            --brand-gradient: linear-gradient(105deg, #8CD0FF 0%, #46F1E4 100%);
            --glow-sky: rgba(140, 208, 255, 0.14);
            --glow-mint: rgba(70, 241, 228, 0.11);

            --accent: #46F1E4;
            --accent-ink: #46F1E4;
            --on-accent: #06201E;
            --accent-soft: rgba(70, 241, 228, 0.12);
            --accent-glow: 0 0 0 1px rgba(70, 241, 228, 0.35), 0 6px 24px -6px rgba(70, 241, 228, 0.45);

            --canvas: #0E0F11;
            --surface: #16181B;
            --surface-container-low: #1C1F22;
            --surface-container-high: #272A2E;
            --glass-bg: rgba(22, 24, 27, 0.78);
            --shadow-float: 0 16px 48px -12px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.06);

            --primary: #F6F7F7;
            --on-surface: #EDEEEE;
            --on-surface-variant: #A0A3A2;
            --outline: #5C6063;
            --outline-variant: #2A2E32;
            --error: #FF6060;

            --radius-md: 10px;
            --radius-2xl: 28px;
            --radius-full: 9999px;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        /* global-styles.ts (loaded via index.ts) locks body scrolling for the app
           shell; this page has to scroll on short screens. */
        html body.auth {
            overflow-x: hidden;
            overflow-y: auto;
            height: auto;
            min-height: 100%;
        }
        body {
            background: var(--canvas);
            color: var(--on-surface);
            font: 400 15px/22px var(--font-body);
            font-feature-settings: 'tnum' 1;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        ::selection { background: var(--accent-soft); }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

        .stage {
            position: relative;
            isolation: isolate;
            overflow: hidden;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 16px 28px;
        }
        .center {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 32px;
            padding: 24px 0;
        }

        /* The one brand moment: a wide, very soft sky→mint glow behind the card. */
        .hero { position: relative; width: 100%; max-width: 420px; }
        .hero::before {
            content: '';
            position: absolute;
            z-index: -1;
            inset: -220px -320px;
            background:
                radial-gradient(closest-side at 36% 42%, var(--glow-sky), transparent),
                radial-gradient(closest-side at 64% 60%, var(--glow-mint), transparent);
            pointer-events: none;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        .brand .wordmark { height: 22px; width: auto; display: block; }
        .brand .product {
            font: 500 21px/1 var(--font-body);
            color: var(--on-surface);
            letter-spacing: -0.01em;
            padding-left: 12px;
            border-left: 1px solid var(--outline-variant);
        }

        .card {
            background: var(--glass-bg);
            -webkit-backdrop-filter: blur(24px) saturate(1.4);
            backdrop-filter: blur(24px) saturate(1.4);
            box-shadow: var(--shadow-float);
            border-radius: var(--radius-2xl);
            padding: 40px 36px 32px;
            text-align: center;
        }
        @media (prefers-reduced-motion: no-preference) {
            .card { animation: rise 0.5s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
            @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
        }
        .login-title {
            font: 600 28px/34px var(--font-body);
            letter-spacing: -0.02em;
            color: var(--primary);
            margin-bottom: 10px;
        }
        .login-sub {
            color: var(--on-surface-variant);
            max-width: 320px;
            margin: 0 auto 32px;
        }
        .note {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 20px;
            font: 400 13px/18px var(--font-body);
            color: var(--on-surface-variant);
        }
        .note svg { width: 14px; height: 14px; flex-shrink: 0; color: var(--accent-ink); }
        .login-error {
            margin: -12px auto 20px;
            max-width: 320px;
            font: 400 14px/20px var(--font-body);
            color: var(--error);
        }

        /* Shown by the script below when the OAuth redirect carried no email.
           While it is up, it replaces the sign-in button. */
        #missing-email {
            display: none;
            text-align: left;
            padding-top: 24px;
            margin-top: 28px;
            border-top: 1px solid var(--outline-variant);
        }
        .card:has(#missing-email[style*="block"]) .login-action,
        .card:has(#missing-email[style*="block"]) .note { display: none; }
        #missing-email h2 { font: 600 17px/24px var(--font-body); color: var(--primary); margin-bottom: 4px; }
        #missing-email p { font: 400 14px/20px var(--font-body); color: var(--on-surface-variant); margin-bottom: 20px; }
        #missing-email label {
            display: block;
            font: 500 12px/16px var(--font-body);
            color: var(--on-surface-variant);
            margin-bottom: 6px;
        }
        #missing-email input {
            display: block;
            width: 100%;
            height: 40px;
            padding: 0 12px;
            background: var(--surface-container-high);
            border: 1px solid var(--outline-variant);
            border-radius: var(--radius-md);
            color: var(--on-surface);
            font: 400 14px/20px var(--font-body);
            margin-bottom: 16px;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        #missing-email input::placeholder { color: var(--on-surface-variant); opacity: 0.7; }
        #missing-email input:focus-visible {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }
        #missing-email button {
            width: 100%;
            height: 48px;
            background: var(--brand-gradient);
            color: var(--on-accent);
            border: none;
            border-radius: var(--radius-full);
            font: 600 15px/20px var(--font-body);
            cursor: pointer;
            transition: filter 0.15s ease, box-shadow 0.15s ease;
        }
        #missing-email button:hover { filter: brightness(1.06); box-shadow: var(--accent-glow); }

        .features {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px 20px;
            list-style: none;
            font: 500 13px/18px var(--font-body);
            color: var(--on-surface-variant);
        }
        .features li { display: flex; align-items: center; gap: 8px; }
        .features svg { width: 16px; height: 16px; color: var(--accent-ink); flex-shrink: 0; }

        .footer {
            font: 400 13px/18px var(--font-body);
            color: var(--on-surface-variant);
        }
        .footer a { color: var(--on-surface); text-decoration: none; font-weight: 500; }
        .footer a:hover { color: var(--accent-ink); }

        @media (max-width: 480px) {
            .stage { padding-top: 24px; }
            .center { gap: 28px; }
            .card { padding: 32px 22px 26px; border-radius: 24px; }
            .login-title { font-size: 25px; line-height: 30px; }
        }
    </style>
</head>
<body class="auth">
<div class="stage">
    <main class="center">
        <a class="brand" href="/login.html" aria-label="DIMO Fleet">
            <img class="wordmark" src="/assets/dimo-wordmark.png" alt="" width="85" height="22" />
            <span class="product">Fleet</span>
        </a>

        <div class="hero">
            <div class="card">
                <h1 class="login-title">Your fleet, live</h1>
                <p class="login-sub">Sign in with your DIMO account to see every vehicle, trip and document in one place.</p>
                <p id="login-error" class="login-error" role="alert" hidden></p>
                <div class="login-action">
                    <login-element></login-element>
                </div>

                <div id="missing-email">
                    <h2>Almost there</h2>
                    <p>We couldn't get your email from your DIMO account. Add it to finish signing in.</p>
                    <form id="emailForm">
                        <label for="email">Email address</label>
                        <input id="email" type="email" placeholder="you@company.com" maxlength="60" autocomplete="email" />
                        <button type="button" id="submitEmail">Continue</button>
                    </form>
                </div>
            </div>
        </div>

        <ul class="features" aria-label="What you get">
            <li>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>
                Live telemetry
            </li>
            <li>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18H15a3.5 3.5 0 0 0 0-7H9a3.5 3.5 0 0 1 0-7h6.5"/></svg>
                Trip history
            </li>
            <li>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>
                Glovebox
            </li>
        </ul>
    </main>

    <footer class="footer">
        Powered by <a href="https://dimo.org" target="_blank" rel="noopener">DIMO</a>
    </footer>
</div>

<script type="module">
    import { isTokenExpired } from './src/utils/token.ts';
    import { classifyLoginRedirect } from './src/login-redirect.ts';
    import { SettingsService } from './src/services/settings-service.ts';

    // After a successful login, an invitee with a stashed invite token returns
    // to the accept page (which finishes binding their wallet); everyone else
    // lands on the app root.
    function postLoginDest() {
        return localStorage.getItem('pendingInviteToken') ? '/accept-invite.html' : '/';
    }

    function hasLiveSession() {
        return !isTokenExpired(localStorage.getItem('token'));
    }

    // A token is only a sign-in when DIMO issued it to *this* app (see
    // src/login-redirect.ts), which needs our client id. It is read before
    // anything is stored, and a token is never stored unchecked.
    async function appClientId() {
        if (!new URLSearchParams(location.search).has('token')) return null;
        try {
            return (await SettingsService.getInstance().fetchPublicSettings()).clientId || null;
        } catch {
            return null;
        }
    }

    function showError(text) {
        const el = document.getElementById('login-error');
        el.textContent = text;
        el.hidden = false;
    }

    // Shown when the OAuth redirect carried an empty email; replaces the button.
    function showMissingEmail() {
        document.getElementById('missing-email').style.display = 'block';
        const input = document.getElementById('email');
        document.getElementById('submitEmail').addEventListener('click', () => {
            const v = input.value;
            if (!v) { alert('Please enter a valid email address.'); return; }
            localStorage.setItem('email', v);
            window.location.href = postLoginDest();
        });
    }

    (async () => {
        const outcome = classifyLoginRedirect(location.search, await appClientId());
        // Whatever came in the query (a token, an email) does not stay in the
        // address bar or the history.
        if (location.search) history.replaceState(null, '', '/login.html');

        switch (outcome.kind) {
            case 'logout':
                localStorage.removeItem('token');
                localStorage.removeItem('email');
                break;
            case 'none':
                if (hasLiveSession()) window.location.href = '/';
                break;
            case 'not-a-sign-in':
                // A "Grant permissions" round trip (the grantor's token for the
                // fleet's license) or another app's token. Not ours to keep:
                // whoever is signed in here stays signed in.
                if (hasLiveSession()) window.location.replace('/');
                break;
            case 'unverified':
                showError("We couldn't verify that sign-in. Please sign in again.");
                break;
            case 'sign-in':
                localStorage.setItem('token', outcome.token);
                localStorage.setItem('email', outcome.email);
                if (outcome.emailMissing) {
                    showMissingEmail();
                } else {
                    window.location.href = postLoginDest();
                }
                break;
        }
    })();
</script>
</body>
</html>
