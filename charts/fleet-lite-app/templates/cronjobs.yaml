{{- range .Values.cronJobs }}
{{- /*
  Numeric overrides are read with hasKey rather than `default`. Helm's `default`
  treats 0 as empty, so an explicit 0 — backoffLimit: 0 to stop a deterministic
  failure being retried, ttlSecondsAfterFinished: 0 to bin a pod immediately —
  was silently replaced by the fallback, with nothing to indicate the value had
  been ignored.
*/}}
{{- if .enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "fleet-lite-app.fullname" $ }}-{{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "fleet-lite-app.labels" $ | nindent 4 }}
spec:
  schedule: {{ .schedule | quote }}
  concurrencyPolicy: {{ .concurrencyPolicy | default "Forbid" }}
  successfulJobsHistoryLimit: {{ if hasKey . "successfulJobsHistoryLimit" }}{{ .successfulJobsHistoryLimit }}{{ else }}3{{ end }}
  failedJobsHistoryLimit: {{ if hasKey . "failedJobsHistoryLimit" }}{{ .failedJobsHistoryLimit }}{{ else }}3{{ end }}
  jobTemplate:
    spec:
      backoffLimit: {{ if hasKey . "backoffLimit" }}{{ .backoffLimit }}{{ else }}1{{ end }}
      activeDeadlineSeconds: {{ if hasKey . "activeDeadlineSeconds" }}{{ .activeDeadlineSeconds }}{{ else }}1800{{ end }}
      ttlSecondsAfterFinished: {{ if hasKey . "ttlSecondsAfterFinished" }}{{ .ttlSecondsAfterFinished }}{{ else }}3600{{ end }}
      template:
        metadata:
          labels:
            {{- include "fleet-lite-app.selectorLabels" $ | nindent 12 }}
            cronjob: {{ .name }}
          annotations:
            # Job pods MUST be meshed, and must then shut the proxy down by hand
            # (see the container command below).
            #
            # This was `disabled` for a long time, for a real reason: an injected
            # proxy outlives the main container, so the pod never terminates and
            # activeDeadlineSeconds kills the job as Failed even when the work
            # succeeded. But unmeshed is worse, and silently so — identity-api
            # authorizes on mesh identity and returns 403 to an unmeshed caller,
            # so the developer-license lookup fails, DIMORedirectURI is never
            # resolved, and every developer-JWT call dies with "Unregistered
            # redirect_uri". import-group-attestations logged those at debug and
            # exited 0 anyway, so it ran green nightly while doing nothing:
            # measured 18s and zero changes unmeshed, versus 243s and 22 plates
            # plus 17 VINs meshed.
            #
            # So: mesh it, and terminate the proxy explicitly.
            linkerd.io/inject: enabled
            {{- with $.Values.podAnnotations }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        spec:
          {{- with $.Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          serviceAccountName: {{ include "fleet-lite-app.serviceAccountName" $ }}
          securityContext:
            {{- toYaml $.Values.podSecurityContext | nindent 12 }}
          restartPolicy: {{ .restartPolicy | default "Never" }}
          terminationGracePeriodSeconds: {{ if hasKey . "terminationGracePeriodSeconds" }}{{ .terminationGracePeriodSeconds }}{{ else }}30{{ end }}
          containers:
            - name: {{ .name }}
              securityContext:
                {{- toYaml $.Values.securityContext | nindent 16 }}
              image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag | default $.Chart.AppVersion }}"
              imagePullPolicy: {{ $.Values.image.pullPolicy }}
              # The proxy shutdown lives here, not in values, so a cronjob added
              # later cannot forget it and reintroduce the hang. values supplies
              # `script`; this wraps it and preserves the real exit code.
              # busybox wget is in the image; the proxy admin server is on :4191.
              command:
                - /bin/sh
                - -c
                - |
                  {{- .script | trim | nindent 18 }}
                  code=$?
                  wget -q -O- --post-data='' http://localhost:4191/shutdown >/dev/null 2>&1 || true
                  exit $code
              envFrom:
                - configMapRef:
                    name: {{ include "fleet-lite-app.fullname" $ }}-config
                - secretRef:
                    name: {{ include "fleet-lite-app.fullname" $ }}-secret
              resources:
                {{- toYaml (.resources | default $.Values.resources) | nindent 16 }}
          {{- with $.Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $.Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
{{- end }}
