apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "fleet-lite-app.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
spec:
  data:
  - remoteRef:
      key: {{ .Release.Namespace }}/fleet-lite-app/db_user
    secretKey: DB_USER
  - remoteRef:
      key: {{ .Release.Namespace }}/fleet-lite-app/db_password
    secretKey: DB_PASSWORD
  - remoteRef:
      key: {{ .Release.Namespace }}/fleet-lite-app/db_host
    secretKey: DB_HOST
  - remoteRef:
      key: {{ .Release.Namespace }}/fleet-lite-app/dimo_auth_private_key
    secretKey: DIMO_AUTH_PRIVATE_KEY
  # AES-256-GCM key for tenant DIMO credentials at rest. The app refuses to boot
  # without it outside local: an empty value is not "no encryption", it is
  # encryption under sha256(""), which anyone can compute.
  # The AWS Secrets Manager entry must exist before this chart is applied — a
  # missing remoteRef fails the whole ExternalSecret, not just this key.
  - remoteRef:
      key: {{ .Release.Namespace }}/fleet-lite-app/tenant_secret_enc_key
    secretKey: TENANT_SECRET_ENC_KEY
  # Pre-shared key gating fleet-tenancy-api's /v1. One key per calling app, so
  # any one can be rotated without a coordinated redeploy of the others. It
  # identifies the application only — the developer-license JWT sent alongside
  # it is what says which tenant we are acting as.
  - remoteRef:
      key: {{ .Release.Namespace }}/fleet-lite-app/tenancy_api_key
    secretKey: TENANCY_API_KEY

  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager-secret-store
  target:
    name: {{ include "fleet-lite-app.fullname" . }}-secret
    template:
      metadata: {}
