replicaCount: 1
image:
  repository: dimozone/fleet-lite-app
  pullPolicy: IfNotPresent
  tag: d4d988e
imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''
serviceAccount:
  create: true
  annotations: {}
  name: ''
podAnnotations: {}
podSecurityContext: {}
securityContext: {}
env:
  ENVIRONMENT: dev
  USE_DEV_CERTS: false
  API_PORT: '8084'
  MONITORING_PORT: '8085'
  LOG_LEVEL: info
  ALLOW_LEGACY_EMPTY_ENC_KEY: 'false'
  SERVICE_NAME: fleet-lite-app
  DB_NAME: fleets_lite
  JWT_KEY_SET_URL: https://auth.dev.dimo.zone/keys
  TOKEN_EXCHANGE_URL: https://token-exchange-api.dev.dimo.zone
  DIMO_LOGIN_URL: https://login.dev.dimo.org
  DIMO_AUTH_URL: https://auth.dev.dimo.zone
  DIMO_AUTH_CLIENT_ID: '0x0000000000000000000000000000000000000000'
  DIMO_AUTH_REDIRECT_URL: https://fleet-lite.dev.dimo.org/login.html
  IDENTITY_API_ENDPOINT: https://identity-api.dev.dimo.zone/query
  ALLOWED_ORIGINS: https://fleet-lite.dev.dimo.org
  CHAIN_ID: '137'
  VEHICLE_NFT_ADDRESS: '0xbA5738a18d83D41847dfFbDC6101d37C69c9B0cF'
service:
  type: ClusterIP
  ports:
    mon-http:
      port: 8085
      targetPort: mon-http
      protocol: TCP
    http:
      port: 8084
      targetPort: http
      protocol: TCP
ports:
  - name: mon-http
    containerPort: 8085
    protocol: TCP
  - name: http
    containerPort: 8084
    protocol: TCP
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/auth-tls-secret: ingress/cf-origin-ca
    nginx.ingress.kubernetes.io/auth-tls-verify-client: 'on'
    nginx.ingress.kubernetes.io/enable-cors: 'true'
    nginx.ingress.kubernetes.io/cors-allow-origin: https://fleet-lite.dev.dimo.org
    external-dns.alpha.kubernetes.io/hostname: fleet-lite.dev.dimo.org
  hosts:
    - host: fleet-lite.dev.dimo.org
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
nodeSelector: {}
tolerations: []
affinity: {}
podDisruptionBudget:
  minAvailable: 0
serviceMonitor:
  enabled: true
  path: /metrics
  port: mon-http
  interval: 30s
cronJobs:
  - name: sync-vehicles
    enabled: true
    schedule: 0 3 * * *
    command:
      - /bin/sh
      - '-c'
      - |
        /fleet-lite-app sync-vehicles; exit $?
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  - name: import-group-attestations-warm
    enabled: true
    schedule: 0 6 * * *
    command:
      - /bin/sh
      - '-c'
      - |
        /fleet-lite-app import-group-attestations -warm-only; exit $?
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  - name: import-group-attestations-full
    enabled: true
    schedule: 0 4 * * 0
    activeDeadlineSeconds: 3600
    command:
      - /bin/sh
      - '-c'
      - |
        /fleet-lite-app import-group-attestations; exit $?
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
